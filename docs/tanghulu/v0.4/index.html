<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰糖葫芦 · 本地试玩 v0.4</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="order-ui.css"><body><div id="viewport"><main id="stage"><header id="hud"><span id="time">120秒</span><span id="level">等级 1</span><span id="score">总分 0</span><button id="pause" aria-label="暂停">Ⅱ</button></header><section id="scene"></section><div id="overlay" hidden></div></main></div><details id="tools"><summary>试玩设置 · <span id="modeText">自动 · L1</span></summary><div class="toolrow"><label>等级 <select id="lock"><option value="0">自动</option><option value="1">锁定 L1</option><option value="2">锁定 L2</option><option value="3">锁定 L3</option><option value="4">锁定 L4</option><option value="5">锁定 L5</option><option value="6">锁定 L6</option></select></label><label>下落速度 <input id="speed" type="range" min="50" max="150" step="10" value="100"><output id="speedValue">100%</output></label><label>水果尺寸 <input id="size" type="range" min="70" max="130" step="10" value="100"><output id="sizeValue">100%</output></label><label>出果频率 <input id="density" type="range" min="50" max="150" step="10" value="100"><output id="densityValue">100%</output></label><button id="resetSettings">恢复默认</button><button id="restart">重新开始</button><button id="export">下载本局记录</button></div><p>设置从下一单生效；重新开始保留设置，刷新恢复默认。速度越高落得越快；尺寸同时改变落果和碰撞范围；出果频率越高，新水果出现越快；同轨道始终保留安全间距。</p></details><script src="assets.js"></script><script src="engine.js"></script><script src="catch-view.js"></script><script src="order-ui.js"></script><script src="progress-ring.js"></script><script src="app.js"></script></body></html>
