<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰糖葫芦 · 公共模板本地试玩</title><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="public-template/template.css"><link rel="stylesheet" href="order-ui.css"><link rel="stylesheet" href="local.css"><body><div id="mount"></div><div id="gate"><img src="assets/icon.png" alt=""><h1>冰糖葫芦</h1><p>本轮试玩不含教学引导</p><button id="launch">开始试玩</button></div><details id="tools"><summary>试玩设置 · <span id="status">自动 · L1</span></summary><label>等级 <select id="lock"><option value="0">自动</option><option value="1">L1</option><option value="2">L2</option><option value="3">L3</option><option value="4">L4</option><option value="5">L5</option><option value="6">L6</option></select></label><label>下落速度<input id="speed" type="range" min="50" max="150" value="100" step="1"><output id="speedValue">100%</output></label><label>水果尺寸<input id="size" type="range" min="70" max="130" value="100" step="1"><output id="sizeValue">100%</output></label><label>出果频率<input id="density" type="range" min="50" max="150" value="100" step="1"><output id="densityValue">100%</output></label><label>背景音乐<input id="music" type="range" min="0" max="100" value="18" step="1"><output id="musicValue">18%</output></label><label>接果音效<input id="sfx" type="range" min="0" max="100" value="100" step="1"><output id="sfxValue">100%</output></label><button id="defaults">恢复默认</button><button id="restart">重新开始</button><p>等级、速度、尺寸、出果频率从下一单生效；音量即时生效。重新开始保留设置，刷新恢复默认。</p></details><script src="assets.js"></script><script src="engine.js"></script><script src="catch-view.js"></script><script src="order-ui.js"></script><script src="progress-ring.js"></script><script src="audio.js"></script><script type="module" src="adapter.js"></script></body></html>
