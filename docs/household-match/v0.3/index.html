<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好物成双 · 公共模板试玩</title><link rel="icon" href="data:,"><link rel="stylesheet" href="public-template/template.css"><link rel="stylesheet" href="game.css"></head><body><div id="mount"></div><div class="review-strip"><span id="applied">正在准备素材</span><button id="settings-open">试玩设置</button></div><dialog id="settings"><form method="dialog"><div class="dialog-head"><h2>试玩设置</h2><button aria-label="关闭设置">×</button></div></form><p>参数在下一盘生效；“应用并重开”立即体验。设置时游戏暂停。</p>
<div class="levels" aria-label="难度选择"><button data-mode="0">自动</button><button data-mode="1">L1<small>2 × 4</small></button><button data-mode="2">L2<small>2 × 5</small></button><button data-mode="3">L3<small>3 × 4</small></button><button data-mode="4">L4<small>3 × 6</small></button><button data-mode="5">L5<small>4 × 5</small></button><button data-mode="6">L6<small>4 × 6</small></button></div>
<label>错配宽容度 <output id="v-tolerance">100%</output><input id="tolerance" type="range" min="50" max="200" step="25" value="100"></label>
<label>错配后停留 <output id="v-hold">100%</output><input id="hold" type="range" min="50" max="200" step="25" value="100"></label>
<label>升级所需成功盘数 <output id="v-upgrade">100%</output><input id="upgrade" type="range" min="100" max="300" step="100" value="100"></label>
<p id="effective"></p><p class="note">100% 为本轮候选：错配上限 6 / 7 / 8 / 11 / 12 / 14 次，停留 1.2 秒，连续独立成功 1 盘升级。锁定等级时不升降。</p><div class="actions"><button id="defaults">恢复默认</button><button id="apply" class="primary">应用并重开</button></div></dialog>
<script src="core.js"></script><script type="module" src="adapter.js"></script></body></html>
