<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>琴键记忆 · 本地试玩 v0.3</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game" aria-label="琴键记忆">
 <header><button id="pause" class="plain">Ⅱ 暂停</button><div class="timer">剩余 <strong id="time">02:00</strong></div><div class="score"><span id="level">L1</span><span>得分 <strong id="score">0</strong></span></div></header>
 <section id="instruction" aria-live="polite"><div id="eyebrow">琴键记忆</div><h1 id="title">弹出一小段旋律</h1><p id="subtitle">先看琴键怎么弹，再照着顺序弹一遍</p><div id="progress">只记顺序，不用赶节奏</div></section>
 <section id="piano" aria-label="九键钢琴"><div class="case-back"></div><div class="keys" id="keys"></div><div class="case-front"></div><div class="cheek left"></div><div class="cheek right"></div></section>
 <footer><span id="mode">自动 · L1</span><button id="replay">再看一次</button><span id="hint">记住位置，慢慢弹</span></footer>
 <div id="answer-feedback" hidden role="status"><div class="answer-symbol" aria-hidden="true"></div><strong id="answer-label"></strong><span id="answer-next"></span></div>
 <div id="overlay"><section class="card" id="card"></section></div>
</main>
<details id="controls"><summary>难度控制看板 <span id="settings-badge">自动 · 100% / 100%</span></summary><div class="control-body"><p>固定九键。选择难度后，下一题生效；教学始终为3个音。</p><input id="set-mode" type="hidden" value="0"><div class="difficulty-grid" aria-label="难度选择"><button data-level="0" class="auto-level">自动升降<small>按表现调整难度</small></button><button data-level="1">L1<small>3 个音</small></button><button data-level="2">L2<small>4 个音</small></button><button data-level="3">L3<small>5 个音</small></button><button data-level="4">L4<small>6 个音</small></button><button data-level="5">L5<small>8 个音</small></button><button data-level="6">L6<small>10 个音</small></button></div><div class="difficulty-status"><strong id="difficulty-current"></strong><p id="difficulty-streak"></p><p id="difficulty-pending"></p></div><label>演示时长 <input id="set-demo" type="range" min="50" max="150" step="10" value="100"><output id="value-demo">100%</output></label><label>无进展等待 <input id="set-idle" type="range" min="50" max="150" step="10" value="100"><output id="value-idle">100%</output></label><p>100%：演示每音 900ms；停顿 10 秒重看。</p><p id="effective">当前生效：等待开始</p><button id="defaults">恢复默认</button><button id="restart">重新开始</button></div></details>
<script src="bank.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
