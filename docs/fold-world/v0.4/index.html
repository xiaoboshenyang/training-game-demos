<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>万象折纸｜本地玩法试玩</title>
  <link rel="stylesheet" href="./public-template/template.css">
  <link rel="stylesheet" href="./game.css">
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: #e9e2d4; color: #382f25; }
    .page { display: grid; grid-template-columns: minmax(0, 1280px) 280px; justify-content: center; gap: 18px; align-items: start; padding: 18px; }
    .game-frame { width: 100%; aspect-ratio: 8 / 5; min-height: 0; position: relative; border-radius: 14px; box-shadow: 0 15px 44px #58422e38; overflow: hidden; background: #f7f1e5; }
    .public-game-shell .game-background { background: #f7f2e7; }
    .review { width: 280px; background: #fffaf2; border: 1px solid #d5c8b2; border-radius: 16px; padding: 16px; box-shadow: 0 8px 28px #58422e16; font-size: 14px; }
    .review h1 { margin: 0; font-size: 19px; }
    .review .caption { margin: 6px 0 14px; color: #776b5e; line-height: 1.5; }
    .review details { border-top: 1px solid #e6d8c6; padding-top: 12px; }
    .review summary { cursor: pointer; font-weight: 700; font-size: 16px; }
    .review fieldset { border: 0; padding: 0; margin: 14px 0 0; }
    .review legend { font-weight: 700; margin-bottom: 8px; }
    .review select, .review input[type=range] { width: 100%; }
    .review select { min-height: 38px; padding: 6px 8px; border-radius: 8px; border: 1px solid #bcae97; background: #fff; color: #382f25; font: inherit; }
    .review .parameter { display: block; margin-top: 14px; }
    .review .parameter-line { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
    .review input[type=range] { margin: 8px 0 0; accent-color: #aa6438; }
    .review small { display: block; color: #756a5d; line-height: 1.4; }
    .review .readout { margin: 14px 0 12px; padding: 10px; border-radius: 10px; background: #f3ebdc; line-height: 1.5; }
    .review button { width: 100%; min-height: 38px; border: 1px solid #a66840; border-radius: 9px; background: #fff; color: #794225; font: inherit; font-weight: 700; cursor: pointer; }
    .review button:hover { background: #f8ebdf; }
    .review .technical { margin-top: 12px; font-size: 12px; color: #766d63; line-height: 1.45; }
    .load-error { display: grid; place-items: center; width: 100%; height: 100%; padding: 32px; color: #7a2e19; text-align: center; font-size: 20px; }
    @media (max-width: 1590px) { .page { grid-template-columns: minmax(0, 1280px); } .review { width: 100%; max-width: 1280px; } .review details:not([open]) { padding: 0; border: 0; } }
    @media (max-width: 700px) { .page { padding: 5px; gap: 8px; } .game-frame { border-radius: 3px; } }
  </style>
</head>
<body>
  <div class="page">
    <div id="gameMount" class="game-frame" aria-label="万象折纸游戏"></div>
    <aside class="review" aria-label="试玩验收控制面板">
      <h1>试玩验收面板</h1>
      <p class="caption">仅供比较玩法，设置保留到刷新页面。</p>
      <details open>
        <summary>等级与参数</summary>
        <fieldset>
          <legend>出题等级</legend>
          <select id="levelMode" aria-label="出题等级">
            <option value="auto">自动升降级</option>
            <option value="1">锁定 L1 基础</option>
            <option value="2">锁定 L2 初阶</option>
            <option value="3">锁定 L3 中阶</option>
            <option value="4">锁定 L4 高阶</option>
            <option value="5">锁定 L5 超凡</option>
            <option value="6">锁定 L6 宗师</option>
          </select>
          <small>切换后从下一题生效，当前题按原等级结算。</small>
        </fieldset>
        <label class="parameter" for="scalePercent">
          <span class="parameter-line"><span>图形与触控大小</span><output id="scaleValue">100%</output></span>
          <input id="scalePercent" type="range" min="80" max="120" step="5" value="100">
          <small>100% = 原尺寸；当前题立即生效。</small>
        </label>
        <label class="parameter" for="reminderPercent">
          <span class="parameter-line"><span>免费操作提醒等待</span><output id="reminderValue">100%</output></span>
          <input id="reminderPercent" type="range" min="50" max="200" step="10" value="100">
          <small>100% ≈ 10 秒无有效拖动；当前题立即生效。</small>
        </label>
        <div id="reviewReadout" class="readout" role="status">正在加载题库…</div>
        <button id="resetReview" type="button">恢复默认</button>
        <p class="technical">玩家画面保持 1280×800，试玩面板不属于产品界面。</p>
      </details>
    </aside>
  </div>
  <script src="./engine.js"></script>
  <script src="./layout.js"></script>
  <script src="./game-core.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
