<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>认知训练游戏 Demo</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f1e9; color: #292b25; }
    main { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 46px); }
    .intro { margin: 0 0 36px; color: #60645a; font-size: 18px; }
    .card { display: block; padding: 28px; border: 1px solid #d5d2c7; border-radius: 18px; background: #fffdf7; color: inherit; text-decoration: none; box-shadow: 0 12px 32px rgba(52, 56, 45, .08); }
    .card:hover { border-color: #858d72; transform: translateY(-2px); }
    .card + .card { margin-top: 18px; }
    .card h2 { margin: 0 0 10px; font-size: 26px; }
    .card p { margin: 0; color: #676b61; line-height: 1.7; }
    .tag { display: inline-block; margin-top: 18px; padding: 7px 12px; border-radius: 999px; background: #e7eadc; color: #46503c; font-weight: 700; }
    footer { margin-top: 30px; color: #777b72; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>认知训练游戏 Demo</h1>
    <p class="intro">用于内部试玩与体验反馈。</p>
    <a class="card" href="cut-and-fill/">
      <h2>Cut &amp; Fill｜推土填坑</h2>
      <p>驾驶工程车推动土块，将土填进对应的坑里，修好剩余道路。</p>
      <span class="tag">进入试玩</span>
    </a>
    <a class="card" href="fishing-master/">
      <h2>钓鱼大师</h2>
      <p>观察鱼群游动，在目标经过中央鱼线时点击下钩，并注意避开鲨鱼。</p>
      <span class="tag">进入试玩</span>
    </a>
    <footer>候选版本仅供测试，规则与画面可能继续调整。</footer>
  </main>
</body>
</html>
