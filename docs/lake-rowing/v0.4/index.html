<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>湖上划船 v0.4 候选试玩</title><link rel="stylesheet" href="shared/template.css"><link rel="stylesheet" href="style.css"><body><details id="panel" open><summary>候选试玩设置（不属于玩家画面）</summary><label>等级 <select id="level"><option value="0">自动</option><option value="1">锁定L1</option><option value="2">锁定L2</option><option value="3">锁定L3</option><option value="4">锁定L4</option><option value="5">锁定L5</option><option value="6">锁定L6</option></select></label><label>干扰比例 <input id="conflict" type="range" min="50" max="150" step="10" value="100"><output id="conflictValue">100%</output></label><label>提示等待 <input id="hint" type="range" min="50" max="150" step="10" value="100"><output id="hintValue">100%</output></label><label>固定种子 <input id="seed" placeholder="空白为随机" size="10"></label><button id="restart">应用并重开</button><button id="defaults">恢复默认</button><button id="export">导出本局日志</button><span id="status"></span><small>参数重开生效，普通再试保留设置，刷新恢复默认。背景暂用同一湖景的三个视角。</small></details><div id="mount"></div><script type="module" src="app.mjs"></script></body></html>
