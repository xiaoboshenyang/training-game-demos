<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>转角成画 · v0.5.0</title><link rel="stylesheet" href="./public-v1.2/template.css"><link rel="stylesheet" href="game.css"></head><body><div id="loading" role="status">正在准备30张图案与有效块资格…</div><div id="mount"></div><section id="comparison"><div class="layout-controls"><strong>布局试用</strong><select id="layoutMode" aria-label="布局"><option value="B">B 方形</option><option value="E">F 无框融合</option></select><button id="layoutB">B · 方形左图右操作</button><button id="layoutE">F · 无框融合底部操作</button></div><div class="picture-controls"><label for="patternSelect">试用图片</label><select id="patternSelect"></select><button id="applyPattern" disabled>换为所选图</button></div><p>实验入口：B 从 L3 开始，F 从 L1 开始，默认自动升级；正式训练仍从 L1 开始。切换 B / F 保留当前题目、旋转角度和剩余时间，便于对照。换图会进入对应的 L1 / L3 / L5；图片保持原比例，完整呈现。</p></section><details id="panel"><summary>试玩控制面板 · 非玩家界面</summary><div class="controls"><label>等级模式<select id="levelMode"><option value="auto">自动升级</option><option value="1">锁定 L1 基础</option><option value="2">锁定 L2 初阶</option><option value="3">锁定 L3 中阶</option><option value="4">锁定 L4 高阶</option><option value="5">锁定 L5 超凡</option><option value="6">锁定 L6 宗师</option></select></label><label>可转块数 <output id="amountText">100%</output><input id="amount" type="range" min="25" max="150" step="5" value="100"></label><label>观察时长 <output id="observeText">100%</output><input id="observe" type="range" min="20" max="200" step="10" value="100"></label><button id="applyNext">立即换题试用</button><button id="defaults">恢复默认</button></div><p id="settings"></p><p id="qualification"></p><p>100%执行规则基线。其他百分比仅作体验实验；每题开始前的完整图观察不扣120秒；点击开始拼图或5秒观察结束自动开始后才扣时。游戏中查看完整图、成功反馈仍扣时。设置只存在本次页面，重开保留，刷新恢复默认。</p></details><script type="module" src="game.js"></script></body></html>
