<div id="app"></div>
<aside id="playtest-tools" aria-label="试玩设置">
  <button id="tool-toggle" type="button" aria-expanded="false" aria-controls="tool-body">试玩设置</button>
  <div id="tool-body" hidden>
    <h2>试玩面板</h2>
    <label>等级 <select id="level-mode"><option value="auto">自动升级</option><option value="1">锁定 L1 基础</option><option value="2">锁定 L2 初阶</option><option value="3">锁定 L3 中阶</option><option value="4">锁定 L4 高阶</option><option value="5">锁定 L5 超凡</option><option value="6">锁定 L6 宗师</option></select></label>
    <label>旋转灵敏度 <input id="turn-percent" type="range" min="70" max="140" step="10" value="100"><output id="turn-value">100%</output></label>
    <label>点按容错 <input id="hit-percent" type="range" min="100" max="160" step="10" value="100"><output id="hit-value">100%</output></label>
    <p id="effective" role="status"></p>
    <p>等级从下一题生效；两项手感参数立即生效。100% 是当前灰盒值，规则仍待试玩校准。</p>
    <button id="restore" type="button">恢复默认</button>
    <label>选题检查 <select id="pick-question"><option value="">自动抽题</option></select></label>
    <button id="load-question" type="button">加载所选题（重开本局）</button>
    <p>题目共 151 道；其中跨级题仍待页面目视复验。</p>
  </div>
</aside>
