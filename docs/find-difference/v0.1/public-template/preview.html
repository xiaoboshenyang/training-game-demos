<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共模板画面</title><link rel="stylesheet" href="template.css"><style>#mount{position:fixed;inset:0}.sample-game{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:30px}.sample-game button{font:inherit;padding:18px 35px;border:0;border-radius:14px;background:#2b7fff;color:white;cursor:pointer}.sample-game h2{margin:0}</style><div id="mount"></div><script type="module">
import {createGameShell} from './template.js';import {getSharedFeedbackAudioUrl} from './vendor/games/shared/utils/shared-assets.js';
const config=await (await fetch('./游戏配置示例.json')).json();const mode=new URLSearchParams(location.search).get('mode')||'full';if(mode==='playtest'){delete config.ability;delete config.oneLine;delete config.principles;delete config.demo;delete config.introAudio;}config.reviewMode=true;let container,api,n=1;config.onState=s=>parent.postMessage({type:"public-template-state",...s},location.origin);const render=()=>{container.innerHTML='<div class="sample-game"><h2>单款游戏可玩区域</h2><div>第 '+n+' 题 · 1280 × 728，顶部已避让72</div><div><button id="correct">模拟正确</button> <button id="wrong">模拟错误</button></div></div>';container.querySelector('#correct').onclick=()=>api.feedback({correct:true,score:api.getState().score+10,scoreDelta:10,onComplete:()=>{n++;render();}});container.querySelector('#wrong').onclick=()=>api.feedback({correct:false,onComplete:()=>{n++;render();}});};
api=createGameShell({mount:document.querySelector('#mount'),config,mode,adapter:{mount(args){container=args.container;api=args.api;},start(){n=1;render();},next(){n++;render();}}});window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(d.screen)api.preview(d.screen);if(d.action==='start')api.enter();if(d.action==='pause')api.pause();if(d.action==='resume')api.resume();if(d.action==='short'){api.preview('game');api.setReviewRemaining(500);api.feedback({correct:true,score:10,scoreDelta:10,onComplete:()=>{n++;render();}});}if(d.action?.startsWith('audio:'))new Audio(getSharedFeedbackAudioUrl(d.action.slice(6))).play();});window.addEventListener('error',e=>parent.postMessage({type:'public-template-state',error:e.message},location.origin));window.addEventListener('unhandledrejection',e=>parent.postMessage({type:'public-template-state',error:String(e.reason)},location.origin));
</script></html>
